<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>A股热力图</title>
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>
<aside id="drawer" aria-label="抽屉菜单">
  <div class="drw-inner">
    <div class="drw-hd"><span>A股热力图</span><button id="drawerClose" type="button" aria-label="收起菜单" title="收起菜单">✕</button></div>
    <div class="drw-sec" id="indices" title="点击切换云图市场"></div>
    <div class="drw-sec">
      <div class="seg" id="sizeMode" title="面积指标">
        <button data-mode="value" class="on">流通市值</button>
        <button data-mode="totalMarketCap">总市值</button>
        <button data-mode="turnover">成交额</button>
      </div>
    </div>
    <div id="drawerContent" class="drw-body">
      <div class="flow-sec">
        <div class="flow-hd"><span>板块资金流</span><button id="flowRefresh" type="button" title="刷新板块资金流">↻</button></div>
        <div class="flow-cols">
          <div class="flow-col"><div class="flow-sub up">净流入(亿)</div><div class="flow-list" id="flowIn"></div></div>
          <div class="flow-col"><div class="flow-sub down">净流出(亿)</div><div class="flow-list" id="flowOut"></div></div>
        </div>
      </div>
    </div>
    <div class="drw-sec drw-summary">
      <div class="stat-tbl" id="counts"></div>
      <div class="legend" aria-hidden="true">
        <span class="arrow fall">▾</span>
        <div class="bar" id="legendBar"><i id="legendTicks"></i></div>
        <span class="arrow rise">▴</span>
      </div>
      <div class="updated" id="updated"></div>
    </div>
  </div>
</aside>
<main id="stage">
  <canvas id="cv" role="img" aria-label="A 股市场热力图画布"></canvas>
  <div id="edgeLeft" title="贴边打开菜单"></div>
  <div id="tip" hidden></div>
</main>
<script src="data/treemap.js?v=13"></script>
<script src="app.js?v=18"></script>
</body>
</html>
